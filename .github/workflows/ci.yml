name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check Apps Script syntax
        run: node --check apps-script/Code.js

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check API syntax
        working-directory: api
        run: npm run check

      - name: Test API behavior
        working-directory: api
        run: npm test

      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Check API formatting
        working-directory: api
        run: npm run format:check

  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: web

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend behavior
        run: npm test

      - name: Build frontend
        run: npm run build
